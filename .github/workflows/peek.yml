name: Peek at a video
# Debug helper: frames from a Drive video (finished Short or source clip), saved as an artifact.
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      video_url: { description: "Drive link", required: true }
      every: { description: "seconds between frames", required: false, default: "2" }
jobs:
  peek:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - env: { GH_TOKEN: "${{ github.token }}", VIDEO_URL: "${{ inputs.video_url }}", EVERY: "${{ inputs.every }}" }
        run: |
          source scripts/download.sh
          download_clip "$VIDEO_URL" v.mp4
          ffprobe -v error -show_entries stream=width,height:format=duration -of compact v.mp4
          mkdir -p peek
          ffmpeg -nostdin -loglevel error -i v.mp4 -vf "fps=1/${EVERY},scale=-2:540" peek/f_%03d.jpg
      - name: Save frames to the peek branch
        run: |
          git config user.name peek; git config user.email peek@users.noreply.github.com
          git checkout --orphan peek-tmp && git rm -rqf . && mv peek/* . && rm -rf peek v.mp4
          git add f_*.jpg && git commit -qm "peek ${{ github.run_id }}" && git push -qf origin HEAD:refs/heads/peek
