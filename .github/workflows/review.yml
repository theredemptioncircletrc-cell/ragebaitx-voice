name: Review a finished clip (test helper)

# Copies a finished clip's frames and audio stats into the review-output branch so they can be checked.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of a voice or commentary run"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review-output
      - name: Make review files
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p dl review
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -D dl
          F=$(find dl -name '*.mp4' | head -1)
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,duration -of compact "$F" > review/probe.txt
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")
          FPS=$(awk -v d="$D" 'BEGIN { printf "%.4f", 12 / d }')
          ffmpeg -nostdin -loglevel error -y -i "$F" -vf "fps=$FPS,scale=270:-2,tile=4x3" -frames:v 1 review/grid.jpg
          ffmpeg -nostdin -loglevel error -y -i "$F" -vn -ac 1 -ar 16000 -t 60 review/audio.wav
          ffmpeg -nostdin -i "$F" -af "volumedetect,silencedetect=n=-35dB:d=0.4" -f null - 2> review/levels.txt || true
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add review && git commit -qm "Review $RUN_ID" && git push -q
