name: Voice change clip

# Started by the n8n "RagebaitX – Clip Factory" workflow, once per clip.
# It can also be started by hand from the Actions tab for testing.
on:
  workflow_dispatch:
    inputs:
      clip_url:
        description: "Direct MP4 link, a Google Drive share link, or release:<tag> to use an MP4 attached to a release"
        required: true
      job_id:
        description: "n8n job ID"
        required: false
        default: "manual"
      clip_id:
        description: "OpusClip clip ID"
        required: false
        default: "manual"
      clip_title:
        description: "Clip title (used for the file name)"
        required: false
        default: "clip"
      callback_url:
        description: "n8n webhook that receives the result (leave empty for manual tests)"
        required: false
        default: ""
      separate_voice:
        description: "Split voice from game sound first (true/false)"
        required: false
        default: "true"
      pitch:
        description: "Pitch shift in semitones (-24 to 24)"
        required: false
        default: "-6"
      index_rate:
        description: "Index rate (0 to 1)"
        required: false
        default: "0.3"
      speed:
        description: "Playback speed of the finished clip (1.0 = unchanged, 1.15 = 15% faster)"
        required: false
        default: "1.15"

run-name: "Voice: ${{ inputs.clip_title }}"

permissions:
  contents: read
  actions: read

env:
  # Applio version this job was built and tested against. Change only on purpose.
  APPLIO_COMMIT: 6d5d9511b7e719b1f613362bc767e841ad72fa72
  PYTHON_VERSION: "3.12"

jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
          ffmpeg -version | head -1

      - name: Restore caches (Python packages, Applio + Demucs models)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
            applio/rvc/models/predictors
            applio/rvc/models/embedders
          key: voice-${{ runner.os }}-${{ env.APPLIO_COMMIT }}-v1

      - name: Install Applio (CPU)
        run: |
          if [ ! -f applio/core.py ]; then
            mkdir -p applio && cd applio
            git init -q
            git remote add origin https://github.com/IAHispano/Applio.git
            git fetch -q --depth 1 origin "$APPLIO_COMMIT"
            git checkout -q -f FETCH_HEAD
            cd ..
          fi
          python -m venv .venv-applio
          .venv-applio/bin/pip install -q --upgrade pip
          .venv-applio/bin/pip install -q torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          .venv-applio/bin/pip install -q -r applio/requirements-engine.txt
          cd applio && ../.venv-applio/bin/python core.py prerequisites --no-pretraineds-hifigan --models --no-exe

      - name: Install Demucs (voice / game sound splitter)
        if: inputs.separate_voice == 'true'
        run: |
          python -m venv .venv-demucs
          .venv-demucs/bin/pip install -q --upgrade pip
          .venv-demucs/bin/pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          .venv-demucs/bin/pip install -q demucs==4.0.1 "numpy<2" soundfile

      - name: Find the voice model
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          PTH=$(ls models/*.pth 2>/dev/null | head -1 || true)
          if [ -z "$PTH" ]; then
            echo "No .pth in models/, trying the 'voice-model' release instead"
            gh release download voice-model -R "$GITHUB_REPOSITORY" -D models -p '*.pth' -p '*.index' || true
            PTH=$(ls models/*.pth 2>/dev/null | head -1 || true)
          fi
          if [ -z "$PTH" ]; then
            echo "::error::No voice model found. Put your .pth (and .index) in the models/ folder, or attach them to a release tagged voice-model."
            exit 1
          fi
          INDEX=$(ls models/*.index 2>/dev/null | head -1 || true)
          echo "pth=$GITHUB_WORKSPACE/$PTH" >> "$GITHUB_OUTPUT"
          echo "index=${INDEX:+$GITHUB_WORKSPACE/$INDEX}" >> "$GITHUB_OUTPUT"
          echo "Using model: $PTH ${INDEX:+(index: $INDEX)}"

      - name: Process the clip
        env:
          GH_TOKEN: ${{ github.token }}
          CLIP_URL: ${{ inputs.clip_url }}
          OUT_FILE: ${{ github.workspace }}/out/voiced.mp4
          WORK_DIR: ${{ runner.temp }}/work
          PTH_PATH: ${{ steps.model.outputs.pth }}
          INDEX_PATH: ${{ steps.model.outputs.index }}
          SEPARATE_VOICE: ${{ inputs.separate_voice }}
          PITCH: ${{ inputs.pitch }}
          INDEX_RATE: ${{ inputs.index_rate }}
          SPEED: ${{ inputs.speed }}
          APPLIO_DIR: ${{ github.workspace }}/applio
          APPLIO_PY: ${{ github.workspace }}/.venv-applio/bin/python
          DEMUCS_PY: ${{ github.workspace }}/.venv-demucs/bin/python
        run: bash scripts/process.sh

      - name: Upload the finished clip
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: voiced-${{ github.run_id }}
          path: out/voiced.mp4
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Tell n8n the result
        if: always() && inputs.callback_url != ''
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          JOB_ID: ${{ inputs.job_id }}
          CLIP_ID: ${{ inputs.clip_id }}
          CLIP_TITLE: ${{ inputs.clip_title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg status "$STATUS" \
            --arg artifact_id "${ARTIFACT_ID:-}" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$RUN_URL" \
            --arg job_id "$JOB_ID" \
            --arg clip_id "$CLIP_ID" \
            --arg clip_title "$CLIP_TITLE" \
            '{status:$status, artifact_id:$artifact_id, run_id:$run_id, run_url:$run_url, job_id:$job_id, clip_id:$clip_id, clip_title:$clip_title}' \
          | curl -sS --retry 3 --retry-delay 5 -X POST -H "Content-Type: application/json" --data @- "$CALLBACK_URL"
